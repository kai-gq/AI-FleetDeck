[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tide-edge-tts-shim"
version = "0.1.0"
description = "piper.exe-compatible shim forwarding to the edge-tts resident service"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
piper = "tts_shim:main"

[tool.setuptools]
py-modules = ["tts_shim"]
